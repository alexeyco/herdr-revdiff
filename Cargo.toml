[package]
name = "herdr-revdiff"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.96.1"
description = "herdr plugin that runs revdiff in a new tab and passes review annotations to the agent"
repository = "https://github.com/alexeyco/herdr-revdiff"
readme = "README.md"
keywords = ["herdr", "revdiff", "plugin", "cli", "code-review"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde_json = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"

[lints.clippy]
all = "warn"