name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches crate and plugin versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"$tag\"" Cargo.toml || { echo "tag $tag != Cargo.toml version"; exit 1; }
          grep -qx "version = \"$tag\"" herdr-plugin.toml || { echo "tag $tag != herdr-plugin.toml version"; exit 1; }

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  create-release:
    needs: [verify, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: herdr-revdiff
          target: ${{ matrix.target }}
          locked: true
          checksum: sha256
          include: LICENSE,README.md,herdr-plugin.toml
          token: ${{ secrets.GITHUB_TOKEN }}