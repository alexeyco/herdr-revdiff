name: Proposal
description: Suggest a change or new capability.
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What does not work today, or what is awkward?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered